name: CI

on:
  push:
    branches: [main]
  pull_request:

# The concurrency-cancel block lives in johnhenry/workflows' ci.yml; repeating
# it here would deadlock the run before it starts.
jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]' # family floor: engines.node >=26.0.0, .nvmrc 26
      os: '["ubuntu-latest"]'
      # liedenticon has zero dependencies and no committed package-lock.json.
      install-command: npm install
      node-cache: ""
      gate-commands: |
        npm test
        npm run examples
        npm pack --dry-run

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
